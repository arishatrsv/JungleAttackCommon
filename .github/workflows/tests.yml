name: Java Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Compile and Test
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile and run tests
        run: mvn --batch-mode clean verify
